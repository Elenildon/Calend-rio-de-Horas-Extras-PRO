name: "Opção A · Gerar APK Android"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web (dist/)
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./HorasExtras-OpcaoA.apk
          ls -lh ./HorasExtras-OpcaoA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HorasExtras-OpcaoA
          path: HorasExtras-OpcaoA.apk
          if-no-files-found: error
